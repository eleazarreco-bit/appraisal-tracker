<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Appraisal Tracker · Sign in</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');
  :root { --ink:#0b1f3a; --paper:#f4f7fc; --line:#dde5f2; --muted:#5f7086; --accent:#0e4c92; --accent-dark:#0a2f63; --accent-2:#ff7a1a; --accent-2-dark:#e8650a; --risk:#dc2626; --risk-bg:#fde3e3; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
         font-family:'Inter','Segoe UI',system-ui,sans-serif; color:var(--ink); background:var(--paper); }
  .card { width:100%; max-width:420px; background:#fff; border-radius:12px; overflow:hidden;
          box-shadow:0 6px 0 -2px var(--accent-2), 0 10px 30px rgba(10,47,99,.18); }
  .head { background:linear-gradient(120deg,var(--accent-dark),var(--accent) 65%,#1c74c9); color:#fff; padding:22px 26px; }
  .eyebrow { font-family:'IBM Plex Mono',Consolas,monospace; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:rgba(255,255,255,.72); margin:0 0 6px; }
  h1 { font-family:'Poppins','Segoe UI',sans-serif; font-size:26px; margin:0; letter-spacing:-.01em; }
  .body { padding:24px 26px 26px; }
  p.hint { margin:0 0 16px; font-size:13.5px; color:var(--muted); line-height:1.5; }
  label { display:block; font-family:'IBM Plex Mono',Consolas,monospace; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin-bottom:6px; }
  input { width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:6px; font-size:15px; font-family:inherit; background:var(--paper); color:var(--ink); }
  input:focus { outline:none; border-color:var(--accent); background:#fff; }
  button.go { width:100%; margin-top:14px; padding:11px 16px; font-size:14px; font-weight:600; font-family:inherit; color:#fff; cursor:pointer;
              border:1px solid var(--accent-2); border-radius:6px; background:linear-gradient(135deg,var(--accent-2),var(--accent-2-dark)); }
  button.go:disabled { opacity:.6; cursor:wait; }
  .err { display:none; margin-top:12px; padding:9px 12px; font-size:12.5px; color:var(--risk); background:var(--risk-bg); border-radius:6px; }
  .err.show { display:block; }
  .alt { margin-top:18px; text-align:center; font-family:'IBM Plex Mono',Consolas,monospace; font-size:11.5px; }
  .alt a { color:var(--accent); cursor:pointer; text-decoration:underline; }
  .loading { padding:44px 26px; text-align:center; color:var(--muted); font-family:'IBM Plex Mono',Consolas,monospace; font-size:13px; }
</style>
</head>
<body>
  <div class="card">
    <div class="head">
      <p class="eyebrow">Improve Business Solutions · Employee Appraisal</p>
      <h1>Appraisal Tracker</h1>
    </div>
    <div class="loading" id="checking">Checking your session…</div>
    <form class="body" id="form" style="display:none;" autocomplete="off">
      <p class="hint" id="hint">Enter your Employee ID (or registered phone number if you are a lead) and the 6-digit PIN you were given.</p>
      <label for="val" id="lbl">Phone number or Employee ID</label>
      <input id="val" name="val" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" required>
      <div id="pinWrap" style="margin-top:12px;">
        <label for="pin">PIN</label>
        <input id="pin" name="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" spellcheck="false" required>
      </div>
      <button class="go" id="go" type="submit">Continue</button>
      <div class="err" id="err" role="alert"></div>
      <div class="alt"><a id="switch">Master access</a></div>
    </form>
  </div>

<script>
(function () {
  const API = "/.netlify/functions/appraisal-data";
  const KEY = "ar_token";
  let mode = "access";
  const $ = (id) => document.getElementById(id);

  async function launch(token) {
    const res = await fetch(API + "?action=app", { headers: { authorization: "Bearer " + token }, cache: "no-store" });
    if (res.status === 401) { sessionStorage.removeItem(KEY); return false; }
    if (!res.ok) throw new Error("Could not load the tool (" + res.status + ")");
    const html = await res.text();
    document.open(); document.write(html); document.close();
    return true;
  }

  function showForm() { $("checking").style.display = "none"; $("form").style.display = "block"; $("val").focus(); }
  function showError(msg) { $("err").textContent = msg; $("err").classList.add("show"); }

  $("switch").addEventListener("click", () => {
    mode = mode === "access" ? "master" : "access";
    const m = mode === "master";
    $("val").type = m ? "password" : "text";
    $("val").value = "";
    $("pin").value = "";
    $("pinWrap").style.display = m ? "none" : "block";
    $("pin").required = !m;
    $("val").autocapitalize = m ? "off" : "characters";
    $("lbl").textContent = m ? "Master password" : "Phone number or Employee ID";
    $("hint").textContent = m ? "Master access is for administrators only." : "Enter your Employee ID (or registered phone number if you are a lead) and the 6-digit PIN you were given.";
    $("switch").textContent = m ? "Back to phone / Employee ID" : "Master access";
    $("err").classList.remove("show");
    $("val").focus();
  });

  $("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    $("err").classList.remove("show");
    $("go").disabled = true; $("go").textContent = "Checking…";
    try {
      const res = await fetch(API + "?action=login", {
        method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ mode, value: $("val").value, pin: mode === "master" ? "" : $("pin").value })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.token) { showError(data.error || "Something went wrong. Please try again."); return; }
      sessionStorage.setItem(KEY, data.token);
      await launch(data.token);
    } catch (err) {
      showError("Could not reach the server. Please check your connection and try again.");
    } finally {
      if ($("go")) { $("go").disabled = false; $("go").textContent = "Continue"; }
    }
  });

  (async function boot() {
    const t = sessionStorage.getItem(KEY);
    if (t) { try { if (await launch(t)) return; } catch (e) {} }
    showForm();
  })();
})();
</script>
</body>
</html>
